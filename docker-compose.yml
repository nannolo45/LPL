# LightPhotoLibrary on the NAS.
#
# Option A (recommended): use the ready-made image that GitHub builds on every push.
#   The repo is private, so the NAS must log in to GitHub's registry once:
#     docker login ghcr.io -u nannolo45      (password: a GitHub token with "read:packages")
#   Synology: Container Manager > Registry > Settings > Add: https://ghcr.io, same user + token.
# Option B: build it on the NAS from this folder: comment out "image:" and uncomment "build: .".
#
# Then: change the photo path below, start the project, open http://<nas-address>:8080

services:
  lightphotolibrary:
    image: ghcr.io/nannolo45/lpl:latest
    # build: .
    container_name: lightphotolibrary
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SCAN_INTERVAL=900          # look for new photos every 15 minutes
      - PREVIEW_WORKERS=2          # raise on a fast NAS, lower on a slow one
      - LPL_PASSWORD=              # optional: set a password for the web app and the PC agent
      - WRITE_SERIES_TAGS=1        # series are also written as tags "series|<name>" so darktable sees them
      - TZ=Europe/Berlin
    volumes:
      # your photos: read-write, because LPL writes ratings/labels/tags into the .xmp sidecars
      - /volume1/photo:/photos
      # LPL's own database, previews and XMP backups (keep this on the NAS's fastest disk)
      - ./data:/data
    # Run as your NAS user so new .xmp files belong to you (Synology: id -u / id -g in SSH, often 1026:100)
    # user: "1026:100"
