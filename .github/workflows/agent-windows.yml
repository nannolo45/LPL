name: Windows agent (.exe)

# Builds lpl-agent.exe (setup/status, with a console) and lpl-agentw.exe (runs hidden in the background),
# packed with the installer and the darktable bridge script into lpl-agent-windows.zip.
# Download it from the repo's Releases page: "Windows agent (latest build)", or a version release (tag v*).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["agent/**", "server/**", "web/**", ".github/workflows/agent-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # the agent also runs this PC's local library, so it bundles the server and the web app
      - name: Build the web app
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx vite build

      - name: Get exiftool for Windows
        shell: pwsh
        run: |
          $ver = (Invoke-WebRequest -UseBasicParsing https://exiftool.org/ver.txt).Content.Trim()
          $urls = @("https://downloads.sourceforge.net/project/exiftool/exiftool-${ver}_64.zip",
                    "https://exiftool.org/exiftool-${ver}_64.zip")
          $got = $false
          foreach ($u in $urls) {
            try { Invoke-WebRequest -UseBasicParsing -UserAgent "curl/8" $u -OutFile et.zip; $got = $true; break }
            catch { Write-Host "not at $u" }
          }
          if (-not $got) { throw "exiftool $ver download failed" }
          Expand-Archive et.zip -DestinationPath et
          $src = Get-ChildItem et -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path exiftool | Out-Null
          Copy-Item "$($src.FullName)\*" exiftool -Recurse
          Rename-Item "exiftool\exiftool(-k).exe" "exiftool.exe"
          .\exiftool\exiftool.exe -ver

      - name: Build the two executables
        shell: pwsh
        working-directory: agent
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r ..\server\requirements.txt
          $common = @("--onefile", "--icon", "lpl.ico", "--paths", "..\server",
                      "--collect-submodules", "lpl", "--collect-submodules", "uvicorn",
                      "--collect-binaries", "rawpy", "--add-data", "..\web\dist;web_dist",
                      "--exclude-module", "rawpy.enhance", "--exclude-module", "scipy", "--exclude-module", "skimage",
                      "--exclude-module", "cv2", "--exclude-module", "imageio", "--exclude-module", "matplotlib", "--exclude-module", "tkinter")
          python -m PyInstaller @common --console   --name lpl-agent  lpl_agent.py
          python -m PyInstaller @common --noconsole --name lpl-agentw lpl_agent.py
          .\dist\lpl-agent.exe --help

      - name: Self-test (local library, web app, exiftool, rawpy)
        shell: pwsh
        run: |
          Copy-Item exiftool agent\dist\exiftool -Recurse -Force
          .\agent\dist\lpl-agent.exe --selftest
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          $out = "lpl-agent-windows"
          New-Item -ItemType Directory -Force -Path "$out\dist", "$out\darktable" | Out-Null
          Copy-Item agent\dist\lpl-agent.exe, agent\dist\lpl-agentw.exe "$out\dist\"
          Copy-Item agent\darktable\lpl_bridge.lua "$out\darktable\"
          Copy-Item exiftool "$out\exiftool" -Recurse
          Copy-Item agent\install-windows.ps1, agent\README.md "$out\"
          Compress-Archive -Path "$out\*" -DestinationPath lpl-agent-windows.zip -Force

      # Published as a release download (release files don't count against the Actions storage quota).
      # Every push to main refreshes the "Windows agent (latest build)" pre-release; version tags get their own release.
      - name: Publish latest build
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-latest
          target_commitish: ${{ github.sha }}
          name: Windows agent (latest build)
          body: "lpl-agent-windows.zip from commit ${{ github.sha }}. Unzip, then right-click install-windows.ps1 > Run with PowerShell."
          prerelease: true
          make_latest: false
          files: lpl-agent-windows.zip

      - name: Attach to version release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: lpl-agent-windows.zip
