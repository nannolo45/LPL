name: Windows agent (.exe)

# Builds lpl-agent.exe (setup/status, with a console) and lpl-agentw.exe (runs hidden in the background),
# packed with the installer and the darktable bridge script into lpl-agent-windows.zip.
# Download it from the repo's Releases page: "Windows agent (latest build)", or a version release (tag v*).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["agent/**", ".github/workflows/agent-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the two executables
        shell: pwsh
        working-directory: agent
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller --onefile --console   --name lpl-agent  lpl_agent.py
          python -m PyInstaller --onefile --noconsole --name lpl-agentw lpl_agent.py
          .\dist\lpl-agent.exe --help

      - name: Package
        shell: pwsh
        run: |
          $out = "lpl-agent-windows"
          New-Item -ItemType Directory -Force -Path "$out\dist", "$out\darktable" | Out-Null
          Copy-Item agent\dist\lpl-agent.exe, agent\dist\lpl-agentw.exe "$out\dist\"
          Copy-Item agent\darktable\lpl_bridge.lua "$out\darktable\"
          Copy-Item agent\install-windows.ps1, agent\README.md "$out\"
          Compress-Archive -Path "$out\*" -DestinationPath lpl-agent-windows.zip -Force

      # Published as a release download (release files don't count against the Actions storage quota).
      # Every push to main refreshes the "Windows agent (latest build)" pre-release; version tags get their own release.
      - name: Publish latest build
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-latest
          target_commitish: ${{ github.sha }}
          name: Windows agent (latest build)
          body: "lpl-agent-windows.zip from commit ${{ github.sha }}. Unzip, then right-click install-windows.ps1 > Run with PowerShell."
          prerelease: true
          make_latest: false
          files: lpl-agent-windows.zip

      - name: Attach to version release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: lpl-agent-windows.zip
