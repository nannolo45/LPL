<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LPL mockup: versions</title>
<style>
:root{--bg:#242424;--pan:#2f2f2f;--pan2:#3a3a3a;--line:#484848;--tx:#d4d4d4;--dim:#8d8d8d;--acc:#bdbdbd}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif;display:flex;height:100vh}
main{flex:1;padding:12px;overflow:auto}aside{width:340px;background:var(--pan);border-left:1px solid var(--line);padding:12px;overflow:auto}
.bar{display:flex;gap:14px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.bar label{color:var(--dim)}h2{font-size:15px;margin:0 0 8px}
button,select{font:inherit;color:var(--tx);background:var(--pan2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,150px);gap:10px}
.tile{position:relative;height:112px;border-radius:4px;border:2px solid transparent;cursor:pointer;overflow:hidden}
.tile.sel{border-color:var(--acc)}
.tile .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);font-size:11px;padding:2px 6px;display:flex;justify-content:space-between}
.badge{position:absolute;right:6px;top:6px;background:#111;border:1px solid var(--acc);border-radius:10px;padding:1px 7px;font-size:12px}
.stack:before{content:"";position:absolute;inset:0;border:1px solid var(--line);transform:translate(4px,-4px);pointer-events:none}
.g0{background:linear-gradient(135deg,#6d6d6d,#a5a5a5 45%,#505050)}
.g1{background:linear-gradient(135deg,#6d6d6d,#a5a5a5 45%,#505050)}
.g2{background:linear-gradient(135deg,#6d6d6d,#a5a5a5 45%,#505050);filter:grayscale(1) contrast(1.4)}
.g3{background:linear-gradient(135deg,#6d6d6d,#a5a5a5 45%,#505050);filter:brightness(.6)}
.g4{background:linear-gradient(45deg,#555,#999 60%,#444)}
.big{height:190px;border-radius:4px;margin-bottom:8px}
.strip{display:flex;gap:6px;overflow:auto;padding:4px 0}
.vt{flex:none;width:86px;cursor:pointer;border:2px solid transparent;border-radius:4px;padding:2px;font-size:11px;text-align:center}
.vt.cur{border-color:var(--acc)}.vt div.th{height:56px;border-radius:3px;margin-bottom:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:10px 0;color:var(--dim)}.kv b{color:var(--tx);font-weight:500}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.s{color:#c9c9c9;letter-spacing:2px}.hint{color:var(--dim);font-size:12px;margin-top:10px;line-height:1.4}
.exp{margin:0 0 6px;color:var(--dim);font-size:12px;grid-column:1/-1}
</style></head><body>
<main>
 <div class="bar"><b>LightPhotoLibrary</b><span style="color:var(--dim)">Folder: Lake trip</span>
  <label>Versions: <select id="mode"><option value="stack">one tile with a badge</option><option value="all">every version a tile</option></select></label>
  <label><input type="checkbox" id="onlyv"> only photos with versions</label>
  <label>Series: <select id="ser"><option value="">none</option><option value="1">Lake story</option></select></label></div>
 <div class="grid" id="grid"></div>
 <div class="hint" id="serhint"></div>
</main>
<aside id="panel"></aside>
<script>
const $=id=>document.getElementById(id);
const P=[
 {id:1,name:"IMG_01.RAF",cover:0,r:4,vs:[{n:0,look:0,name:"",r:4,l:"red"},{n:1,look:1,name:"warm",r:4,l:""},{n:2,look:2,name:"black and white",r:5,l:"green"}]},
 {id:2,name:"IMG_02.RAF",cover:0,r:3,vs:[{n:0,look:4,name:"",r:3,l:""}]},
 {id:3,name:"IMG_03.RAF",cover:0,r:2,vs:[{n:0,look:3,name:"",r:2,l:""},{n:1,look:0,name:"print",r:2,l:""}]},
 {id:4,name:"IMG_04.RAF",cover:0,r:5,vs:[{n:0,look:1,name:"",r:5,l:"yellow"}]},
 {id:5,name:"IMG_05.RAF",cover:0,r:1,vs:[{n:0,look:2,name:"",r:1,l:""}]}];
let selP=1,selV=0,pin={1:2};
const fn=(p,n)=>n?p.name.replace(/(\.\w+)$/,"_"+String(n).padStart(2,"0")+"$1.xmp"):p.name+".xmp";
const stars=n=>"★".repeat(n)+"☆".repeat(5-n);
const cv=(p,v)=>p.vs.find(x=>x.n==(v??p.cover));
function grid(){
 const all=$("mode").value=="all",ser=$("ser").value,only=$("onlyv").checked;let h="";
 P.filter(p=>!only||p.vs.length>1).forEach(p=>{
  const vs=all?p.vs:[cv(p,ser&&pin[p.id]!=null?pin[p.id]:undefined)];
  vs.forEach(v=>{h+=`<div class="tile g${v.look} ${p.vs.length>1&&!all?"stack":""} ${selP==p.id&&(all?selV==v.n:true)?"sel":""}" data-p="${p.id}" data-v="${v.n}">
   ${p.vs.length>1&&!all?`<span class="badge">${p.vs.length}</span>`:""}
   <div class="cap"><span>${p.name}${all&&v.n?" v"+v.n:""}</span><span>${"★".repeat(v.r)}</span></div></div>`})});
 $("grid").innerHTML=h;
 document.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{selP=+t.dataset.p;selV=$("mode").value=="all"?+t.dataset.v:P.find(p=>p.id==selP).cover;grid();panel()});
 $("serhint").textContent=ser?"Series view: an entry is a photo. It shows the cover, or the version pinned for this series (IMG_01 is pinned to v2). The board uses the same rule.":"";
}
function panel(){
 const p=P.find(x=>x.id==selP),v=cv(p,selV);
 $("panel").innerHTML=`<h2>${p.name}${p.vs.length>1?" · "+p.vs.length+" versions":""}</h2>
 <div class="big g${v.look}"></div>
 <div class="strip">${p.vs.map(x=>`<div class="vt ${x.n==selV?"cur":""}" data-n="${x.n}"><div class="th g${x.look}"></div>v${x.n}${x.n==p.cover?" ★":""}<br><span style="color:var(--dim)">${x.name||(x.n?"copy":"original")}</span></div>`).join("")}</div>
 <div class="kv"><span>Viewing</span><b>version ${selV}${v.name?" · "+v.name:""}</b><span>File</span><b>${fn(p,selV)}</b><span>Rating</span><b class="s">${stars(v.r)}</b><span>Label</span><b>${v.l||"none"}</b>
 <span>Cover</span><b>${p.cover==selV?"this version":"version "+p.cover}</b>
 <span>Where</span><b>${selV==2?"on Phone: v2 edited, not synced yet":"synced to NAS"}</b>
 <span>Last edit</span><b>${selV?"Phone · modules: exposure, color balance":"Desktop · modules: exposure"}</b></div>
 <div class="row"><button id="ed">Edit this version in darktable</button><button id="ph">Edit on this phone</button></div>
 <div class="row"><button id="cov">Set as cover</button><button id="pinb">Use in series</button><button id="del">Delete version</button></div>
 <div class="hint">Rating, labels and tags belong to the version you are viewing. The tile shows the cover's. Delete moves the file to LPL's backup folder; the original (v0) cannot be deleted here. Photos with one version look as today.</div>`;
 document.querySelectorAll(".vt").forEach(t=>t.onclick=()=>{selV=+t.dataset.n;grid();panel()});
 $("cov").onclick=()=>{p.cover=selV;grid();panel()};
 $("pinb").onclick=()=>{pin[p.id]=selV;$("ser").value="1";grid();panel()};
 $("del").onclick=()=>{if(selV==0)return alert("The original cannot be deleted here.");if(confirm("Delete version "+selV+"? A copy stays in the backup folder.")){p.vs=p.vs.filter(x=>x.n!=selV);if(p.cover==selV)p.cover=0;selV=p.cover;grid();panel()}};
 $("ph").onclick=()=>alert("Opens: lpldt://edit?server=...&ids="+p.id+"&start="+p.id+"&version="+selV);
 $("ed").onclick=()=>alert("Job for the desktop agent: open "+fn(p,selV)+" in darktable (the agent already copies all version files).");
}
["mode","onlyv","ser"].forEach(i=>$(i).onchange=()=>{selV=P.find(p=>p.id==selP).cover;grid();panel()});
grid();panel();
</script></body></html>
